<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registrazione MusicStream</h1>
<form onsubmit="alert('Registrazione inviata!')">
<label>Nome:<br>
<input type="text" name="nome" placeholder="Mario" required>
</label><br><br>


<label>Cognome:<br>
<input type="text" name="cognome" placeholder="Rossi" required>
</label><br><br>


<label>Email:<br>
<input type="email" name="email" placeholder="mario@example.com" required>
</label><br><br>


<label>Password:<br>
<input type="password" name="password" required>
</label><br><br>


<label>Data di nascita:<br>
<input type="date" name="datanascita" required>
</label><br><br>


<label>Numero di telefono:<br>
<input type="number" name="telefono" required>
</label><br><br>


<label>Gusti musicali:<br>
<input type="checkbox" name="generi" value="rock">Rock
<input type="checkbox" name="generi" value="pop">Pop
<input type="checkbox" name="generi" value="jazz">Jazz
<input type="checkbox" name="generi" value="jazz">Altro
</label><br><br>


<label>Accetto i termini e condizioni
<input type="radio" name="terms" value="accetto" required>
</label><br><br>
<button type="submit"> Invia registrazione</button>
</form>
</body>
</html>
